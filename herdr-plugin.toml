id = "herdr-automatic-rename"
name = "Herdr Automatic Rename"
version = "0.15.0"
# min_herdr_version stays at 0.7.1 deliberately. A requirement above the running
# herdr is a HARD load failure (plugin_requires_newer_herdr), re-checked on every
# event dispatch, whereas an event name an older herdr does not know is only an
# install-preview warning. Newer-herdr features are therefore version-gated at
# runtime instead (see ar_agent_prefix_ok) and newer events are simply declared
# below.
min_herdr_version = "0.7.1"
description = "Auto-name tabs after where the work is and what is running there -- the directory, the branch, the machine reached over ssh, then the program or the task an agent reports -- and/or prefix workspaces, tabs, and agents with their 1-9 jump-key number, and show each named agent on its pane border. Each feature toggles via config.sh."
platforms = ["linux", "macos"]

# One unified reconcile handles both features, so every event runs the SAME
# entry (automatic-rename.sh) with the event name as argv[1], and the pass is
# idempotent. Real-time per-command tab renaming comes from the shell hooks
# under shell/ (see the README), because herdr has no "foreground command
# changed" event.

# herdr 0.7.5 runs [[startup]] once per enabled plugin after it restores the
# session and the API socket is ready, and again when a new server takes over
# during live handoff. Without it the first pass waited for an unrelated event, so
# a restored session showed herdr's own labels (and stale numbers) until the user
# touched something. Not delivered on client attach, config reload, or plugin
# enable/link, so this is genuinely one-shot. Older herdr ignores the whole
# section, which is why min_herdr_version stays at 0.7.1. "startup" is not a
# special mode in the engine: it lands on the same idempotent full reconcile any
# unrecognized event name gets.
[[startup]]
command = ["bash", "automatic-rename.sh", "startup"]

# --- Workspaces: order changes (alt+N target) or label edits ---
[[events]]
on = "workspace.created"
command = ["bash", "automatic-rename.sh", "workspace.created"]

[[events]]
on = "workspace.closed"
command = ["bash", "automatic-rename.sh", "workspace.closed"]

[[events]]
on = "workspace.renamed"
command = ["bash", "automatic-rename.sh", "workspace.renamed"]

# herdr 0.7.3 added a drag-reorder event (0.7.1 had none). alt+N follows the
# sidebar order, so a reorder must renumber; the reconcile is idempotent.
# workspace.moved covers a PLAIN workspace drag (workspace.move).
[[events]]
on = "workspace.moved"
command = ["bash", "automatic-rename.sh", "workspace.moved"]

# herdr 0.8.0 added workspace.move_block for atomic worktree-group reordering,
# and it emits workspace.reordered INSTEAD of workspace.moved. Dragging any
# member of a worktree space takes that path (src/app/input/mouse.rs), so without
# this hook a worktree-group drag left every "[N]" stale until an unrelated event
# happened to fire. Older herdr does not know the name and only warns.
[[events]]
on = "workspace.reordered"
command = ["bash", "automatic-rename.sh", "workspace.reordered"]

# --- Worktrees: reorder the grouped/visible workspace order, can add/remove one ---
[[events]]
on = "worktree.created"
command = ["bash", "automatic-rename.sh", "worktree.created"]

[[events]]
on = "worktree.opened"
command = ["bash", "automatic-rename.sh", "worktree.opened"]

[[events]]
on = "worktree.removed"
command = ["bash", "automatic-rename.sh", "worktree.removed"]

# --- Tabs: naming (foreground program) and numbering (cmd+N array order) ---
[[events]]
on = "tab.created"
command = ["bash", "automatic-rename.sh", "tab.created"]

# tab.closed gets special handling: the entry waits for herdr to drop the closing
# tab before reconciling, so survivors renumber against the settled list.
[[events]]
on = "tab.closed"
command = ["bash", "automatic-rename.sh", "tab.closed"]

# Re-apply on a user rename (alt+r). Our own rename also re-fires this; the
# idempotent skip-if-correct guard stops the loop.
[[events]]
on = "tab.renamed"
command = ["bash", "automatic-rename.sh", "tab.renamed"]

# herdr 0.7.3 added a drag-reorder event. cmd+N indexes a workspace's tabs by
# array order, so a reorder must renumber (idempotent).
[[events]]
on = "tab.moved"
command = ["bash", "automatic-rename.sh", "tab.moved"]

# Focus itself changes numbering: a collapsed worktree space keeps its FOCUSED
# member rendered, so which rows the sidebar shows (and therefore every alt+N
# slot below them) depends on what is focused. See ar_workspace_positions.
#
# tab.focused also backs up the close paths. The interactive close_pane keybind
# (cmd+w) still does not deliver tab.closed to plugins as of herdr 0.8.0, even
# when the pane was the tab's last one; it emits pane.closed (hooked below), and
# tab.focused fires on the post-close focus move. The reconcile is idempotent, so
# the overlap costs nothing.
[[events]]
on = "tab.focused"
command = ["bash", "automatic-rename.sh", "tab.focused"]

[[events]]
on = "pane.focused"
command = ["bash", "automatic-rename.sh", "pane.focused"]

# --- Agents (cmd+alt+N): no agent.created event exists, so infer membership /
#     order changes from pane lifecycle. agent rename emits no event. ---
[[events]]
on = "pane.agent_detected"
command = ["bash", "automatic-rename.sh", "pane.agent_detected"]

# An agent's status change reorders the "priority"-sorted agent panel. There is
# no event for the sort toggle itself, so this frequent status event is what
# makes an active session's numbering self-heal promptly after a resort (strip
# in priority mode, renumber back in grouped mode); it is idempotent otherwise.
[[events]]
on = "pane.agent_status_changed"
command = ["bash", "automatic-rename.sh", "pane.agent_status_changed"]

[[events]]
on = "pane.closed"
command = ["bash", "automatic-rename.sh", "pane.closed"]

[[events]]
on = "pane.exited"
command = ["bash", "automatic-rename.sh", "pane.exited"]

[[events]]
on = "pane.moved"
command = ["bash", "automatic-rename.sh", "pane.moved"]

# A split adds a pane, flipping the tab's pane_count and thus which pane naming
# resolves (a single-pane tab names by its sole pane; a background multi-pane tab
# exposes none). pane.created fires even when the split does NOT move focus, so
# no pane.focused arrives; the reconcile is idempotent. (pane.closed/pane.exited
# already cover the reverse.) Note: herdr's layout.updated is a socket-only event,
# not delivered to plugins, so pane.created is the hook for this.
[[events]]
on = "pane.created"
command = ["bash", "automatic-rename.sh", "pane.created"]

# Opt a manually-renamed tab back into automatic naming (NAME_TABS). Invoke with
#   herdr plugin action invoke herdr-automatic-rename.reset
# or bind a key in config.toml (type = "plugin_action").
[[actions]]
id = "reset"
title = "Reset tab to automatic naming"
contexts = ["global"]
command = ["bash", "automatic-rename.sh", "reset"]

# Print why the current tab has the name it has: versions, the tab's state
# record, its label, and the decisions one real pass made about it. Invoke with
#   herdr plugin action invoke herdr-automatic-rename.doctor
[[actions]]
id = "doctor"
title = "Herdr Automatic Rename: explain this tab's name"
contexts = ["global"]
command = ["bash", "automatic-rename.sh", "doctor"]

# Strip every "[N] " prefix (restore base names / revert agents to detection).
# For a clean uninstall, run the strip directly BEFORE uninstalling, so the
# renames do not re-fire the numbering hooks (see the README's Uninstall steps).
[[actions]]
id = "clear"
title = "Herdr Automatic Rename: strip all number prefixes"
contexts = ["global"]
command = ["bash", "automatic-rename.sh", "--clear"]
